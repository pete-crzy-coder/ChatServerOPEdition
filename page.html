<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Dark Realtime</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            margin: 0;
            font-family: system-ui;
            background: #0b0d10;
            color: #e6e6e6;
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 240px;
            background: #0f131a;
            border-right: 1px solid #1f2430;
            padding: 16px;
        }

        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 8px;
        }

        .msg {
            max-width: 70%;
            padding: 8px 12px;
            border-radius: 14px;
            background: #151a22;
            border: 1px solid #262c3a;
            word-wrap: break-word;
        }

        input,
        button {
            background: #151a22;
            color: #fff;
            border: 1px solid #262c3a;
            padding: 8px;
        }

        #controls {
            display: flex;
            gap: 8px;
            padding: 16px;
            border-top: 1px solid #1f2430;
        }

        video {
            width: 200px;
            border-radius: 8px;
            background: black;
        }
    </style>
</head>

<body>
    <div id="sidebar">
        <h3>Dark GUI</h3>
        <video id="local" autoplay muted></video>
        <video id="remote" autoplay></video>
        <button onclick="startVideo()">Start Video</button>
    </div>
    <div id="main">
        <div id="chat"></div>
        <div id="controls">
            <input id="msg" placeholder="Type something" />
            <button onclick="send()">Send</button>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const chat = document.getElementById('chat');
        const msg = document.getElementById('msg');

        // Ask for username once
        const username = prompt('Username?') || 'Anonymous';
        socket.emit('set-username', username);

        // Chat listener
        socket.on('chat', data => {
            const d = document.createElement('div');
            d.className = 'msg';
            d.innerHTML = `<b>${data.user}:</b> ${data.text}`;
            chat.appendChild(d);
            chat.scrollTop = chat.scrollHeight;
        });

        // System messages (joins/leaves)
        socket.on('system', text => {
            const d = document.createElement('div');
            d.className = 'msg';
            d.style.opacity = '0.6';
            d.style.alignSelf = 'center';
            d.textContent = text;
            chat.appendChild(d);
        });

        function send() {
            if (msg.value.trim()) socket.emit('chat', msg.value);
            msg.value = '';
        }

        // Send on Enter key
        msg.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                send();
            }
        });

        let pc, stream;
        async function startVideo() {
            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            local.srcObject = stream;
            pc = new RTCPeerConnection();
            stream.getTracks().forEach(t => pc.addTrack(t, stream));
            pc.ontrack = e => remote.srcObject = e.streams[0];
            pc.onicecandidate = e => e.candidate && socket.emit('ice', e.candidate);
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            socket.emit('offer', offer);
        }

        socket.on('offer', async offer => {
            pc = new RTCPeerConnection();
            pc.ontrack = e => remote.srcObject = e.streams[0];
            pc.onicecandidate = e => e.candidate && socket.emit('ice', e.candidate);
            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            local.srcObject = stream;
            stream.getTracks().forEach(t => pc.addTrack(t, stream));
            await pc.setRemoteDescription(offer);
            const ans = await pc.createAnswer();
            await pc.setLocalDescription(ans);
            socket.emit('answer', ans);
        });

        socket.on('answer', ans => pc.setRemoteDescription(ans));
        socket.on('ice', c => pc.addIceCandidate(c));
    </script>
</body>

</html>
